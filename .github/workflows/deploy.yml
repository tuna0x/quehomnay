name: CD - Build & Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Môi trường triển khai (Deployment Environment)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 1. Build and Push Docker Image to GitHub Container Registry (GHCR)
  # =========================================================================
  build-and-push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 2. Deploy to Production VPS Server via SSH (Optional / Automated)
  # =========================================================================
  deploy-server:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Deployment Credentials
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ]; then
            echo "has_ssh=true" >> $GITHUB_OUTPUT
          else
            echo "has_ssh=false" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote Deployment via SSH
        if: steps.check-secrets.outputs.has_ssh == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "🚀 Triển khai phiên bản mới của Quẻ Hôm Nay..."
            cd ${{ secrets.DEPLOY_PATH || '~/quehomnay' }}

            # Cập nhật hoặc tạo file .env nếu có secret ENV_PRODUCTION
            if [ -n "${{ secrets.ENV_PRODUCTION }}" ]; then
              echo "📝 Đang cập nhật tệp .env từ GitHub Secret..."
              echo "${{ secrets.ENV_PRODUCTION }}" > .env
            elif [ ! -f .env ] && [ -f .env.example ]; then
              echo "⚠️ Tệp .env chưa tồn tại, tự động sao chép từ .env.example..."
              cp .env.example .env
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "✅ Triển khai hoàn tất thành công!"

      - name: Write Deployment Summary
        run: |
          echo "### 🚀 Báo Cáo Triển Khai (Deployment Summary)" >> $GITHUB_STEP_SUMMARY
          echo "- **Kho lưu trữ:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Nhánh/Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Image:** \`ghcr.io/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-secrets.outputs.has_ssh }}" == "true" ]; then
            echo "- **Trạng thái:** ✅ Đã kích hoạt triển khai lên máy chủ VPS qua SSH." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Trạng thái:** ℹ️ Docker image đã được đẩy lên GHCR thành công. Để triển khai tự động qua SSH, vui lòng cấu hình GitHub Secrets (\`DEPLOY_HOST\`, \`DEPLOY_USER\`, \`DEPLOY_KEY\`, \`DEPLOY_PATH\`)." >> $GITHUB_STEP_SUMMARY
          fi
