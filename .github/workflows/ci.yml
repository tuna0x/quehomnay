name: CI - Code Quality, Build & Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Code Quality & Production Frontend Build
  # =========================================================================
  quality-and-build:
    name: Lint & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: Setup Environment File
        run: cp .env.example .env

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 2

  # =========================================================================
  # 2. Integration & Security RBAC Tests with Live Postgres & Redis
  # =========================================================================
  integration-tests:
    name: Queue, DLQ & RBAC Security Tests
    runs-on: ubuntu-latest
    needs: quality-and-build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quehomnay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: Setup Environment File
        run: cp .env.example .env

      - name: Run Integration Tests & RBAC Verification
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quehomnay
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: quehomnay
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: quehomnay_ci_secret_test_2026_tam_thanh_tat_ung
          ADMIN_EMAILS: admin@quehomnay.vn
        run: npm test

  # =========================================================================
  # 3. Docker Container Build Verification
  # =========================================================================
  docker-build-check:
    name: Dockerfile Build Verification
    runs-on: ubuntu-latest
    needs: quality-and-build
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Verify Multi-stage Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: quehomnay:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
