services:
  postgres:
    image: postgres:16-alpine
    container_name: quehomnay-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quehomnay
    volumes:
      - quehomnay_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quehomnay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - quehomnay_redisdata:/data

volumes:
  quehomnay_pgdata:
    name: quehomnay_pgdata
  quehomnay_redisdata:
    name: quehomnay_redisdata
