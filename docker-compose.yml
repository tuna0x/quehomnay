services:
  postgres:
    image: postgres:16-alpine
    container_name: quehomnay-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quehomnay}
    volumes:
      - quehomnay_pgdata:/var/lib/postgresql/data

volumes:
  quehomnay_pgdata:
    name: quehomnay_pgdata
